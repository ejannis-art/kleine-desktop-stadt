<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kleine Desktop-Stadt</title>
<style>
:root{color-scheme:dark;--ink:#253b3e;--sea:#247b80;--panel:#173d42db;box-sizing:border-box}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#247b80;font-family:system-ui,"Segoe UI",sans-serif;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#palette{position:fixed;z-index:2;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px}
.swatch{--c:#ef4444;width:30px;height:30px;padding:0;border:2px solid #273b3d;border-radius:8px;background:var(--c);box-shadow:0 2px 3px #092f3b77;cursor:pointer;transition:transform .12s,box-shadow .12s}
.swatch:hover{transform:translateX(3px)}
.swatch.selected{border-color:#fff;box-shadow:0 0 0 2px #263638,0 0 0 4px #fff}
#gear{position:fixed;right:12px;top:10px;z-index:3;width:48px;height:48px;border:2px solid #273b3d;border-radius:11px;background:#f6f4e9;color:#293b3e;font-size:26px;cursor:pointer;box-shadow:0 3px 6px #092f3b66}
#menu{position:fixed;right:12px;top:68px;z-index:3;width:min(270px,calc(100vw - 76px));padding:14px;background:var(--panel);border:1px solid #ffffff55;border-radius:12px;color:#f4ffff;box-shadow:0 10px 28px #052e3799;backdrop-filter:blur(8px)}
#menu[hidden]{display:none}
#menu p{margin:0 0 12px;font-size:13px;line-height:1.5}
.menu-row{display:flex;gap:8px;flex-wrap:wrap}
.menu-row button{border:1px solid #ffffff80;border-radius:8px;padding:7px 9px;background:#e9f4ec;color:#20383b;font:inherit;font-size:12px;cursor:pointer}
#hint{position:fixed;right:14px;bottom:12px;z-index:2;padding:5px 10px;border-radius:99px;background:#173d428c;color:#f3ffff;font-size:12px;opacity:.78;pointer-events:none;transition:opacity .5s}
@media(max-width:600px){#palette{left:8px;gap:6px}.swatch{width:27px;height:27px}#gear{right:8px;top:8px;width:40px;height:40px;font-size:22px}#hint{right:8px;bottom:8px;left:44px;text-align:center;font-size:10px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="palette" aria-label="Farbpalette"></div>
<button id="gear" title="Menü" aria-label="Menü">⚙</button>
<div id="menu" hidden>
  <p>Linksklick: bauen · Linksklick auf ein Haus: drehen<br>Rechtsklick: löschen · Rechtsziehen: Ansicht bewegen<br>Mausrad: zoomen · R: Vorschau drehen · Umschalt+Klick: Stockwerk ergänzen</p>
  <div class="menu-row">
    <button id="save">Speicherstand herunterladen</button>
    <button id="load">Speicherstand laden</button>
    <button id="reset">Neue Stadt</button>
    <input id="file" type="file" accept=".json" hidden>
  </div>
</div>
<div id="hint">Farbe wählen, dann mit Linksklick Häuser auf dem Wasser bauen.</div>
<script>
(() => {
const STORE = "kleine-stadt-townscaper-v1";
const COLORS = ["#ed444e","#f17952","#f5c64f","#d9e878","#a9c765","#72c95c","#39c96e","#43c7a5","#48b8d1","#4d96e8","#6b78d7","#a36fc8","#ca5477","#e9a176","#bcb7ad","#eee8dd"];
const $ = id => document.getElementById(id);
const canvas = $("scene"), ctx = canvas.getContext("2d"), palette = $("palette");
let W=0,H=0,dpr=1,zoom=1,cam={x:0,y:0},selected=0,rotation=0,hover=null,down=null,dragging=false,toastTimer=0;
function starter(){return {buildings:[{x:0,y:0,color:0,levels:4,rot:0},{x:1,y:0,color:2,levels:2,rot:0},{x:0,y:1,color:3,levels:1,rot:1}],t:Date.now()};}
function valid(s){return !!(s&&Array.isArray(s.buildings)&&s.buildings.length<600&&s.buildings.every(b=>Number.isFinite(b.x)&&Number.isFinite(b.y)&&b.x>=-80&&b.x<=80&&b.y>=-80&&b.y<=80&&Number.isInteger(b.color)&&b.color>=0&&b.color<COLORS.length));}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE));if(valid(s))return s;}catch(e){}return starter();}
let S=loadState();
function persist(){S.t=Date.now();try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){}}
function note(t){const h=$("hint");h.textContent=t;h.style.opacity="1";clearTimeout(toastTimer);toastTimer=setTimeout(()=>h.style.opacity=".78",2200);}
COLORS.forEach((c,i)=>{const b=document.createElement("button");b.className="swatch"+(i===selected?" selected":"");b.style.setProperty("--c",c);b.title="Farbe "+(i+1);b.setAttribute("aria-label","Farbe "+(i+1));b.onclick=()=>{selected=i;document.querySelectorAll(".swatch").forEach((q,j)=>q.classList.toggle("selected",j===i));note("Farbe "+(i+1)+" gewählt.");};palette.appendChild(b);});
$("gear").onclick=()=>{$("menu").hidden=!$("menu").hidden;};
$("save").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="kleine-stadt.json";a.click();};
$("load").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;f.text().then(t=>{const s=JSON.parse(t);if(valid(s)){S=s;persist();note("Speicherstand geladen.");}else note("Datei passt nicht zu diesem Spiel.");}).catch(()=>note("Datei konnte nicht geladen werden."));};
$("reset").onclick=()=>{if(confirm("Eine neue Townscaper-Stadt starten? Der aktuelle Spielstand wird überschrieben.")){S=starter();cam={x:0,y:0};zoom=1;persist();note("Neue Stadt bereit.");}};
function resize(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);}
function unit(){return Math.max(27,Math.min(62,Math.min(W,H)*.09))*zoom;}
function origin(){return [W*(W<600?.68:.69)+cam.x,H*.51+cam.y];}
function project(x,y,z=0){const u=unit();return [(x-y)*u,(x+y)*u*.52-z*u*.92];}
function screen(x,y,z=0){const o=origin(),p=project(x-.5,y,z);return [o[0]+p[0],o[1]+p[1]];}
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return "rgb("+Math.min(255,r*f|0)+","+Math.min(255,g*f|0)+","+Math.min(255,b*f|0)+")";}
function path(points,fill,stroke="rgba(30,50,51,.64)",width=1){ctx.beginPath();points.forEach((p,i)=>{const q=project(p[0]-.5,p[1],p[2]||0);if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1]);});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
function worldRect(x1,y1,x2,y2,z,fill,stroke){path([[x1,y1,z],[x2,y1,z],[x2,y2,z],[x1,y2,z]],fill,stroke);}
function windowAt(points){path(points,"#f3e7c2","#3c4b49",1);const inset=points.map(p=>p);const cx=inset.reduce((a,p)=>a+p[0],0)/4,cy=inset.reduce((a,p)=>a+p[1],0)/4,cz=inset.reduce((a,p)=>a+(p[2]||0),0)/4;path(inset.map(p=>[cx+(p[0]-cx)*.68,cy+(p[1]-cy)*.72,cz+(p[2]-cz)*.72]),"#79b9c9","#374746",.8);}
function drawRoof(b,z,wall){const x=b.x,y=b.y,r=b.rot||0,roof="#efaa67",lit="#f8cc7d",dark="#d98656";if(r%2===0){const ridge=z+.48;path([[x-.54,y-.54,z],[x+.54,y-.54,z],[x+.54,y,z+ridge-z],[x-.54,y,z+ridge-z]],lit);path([[x-.54,y,z+ridge-z],[x+.54,y,z+ridge-z],[x+.54,y+.54,z],[x-.54,y+.54,z]],roof);for(let j=1;j<5;j++){const yy=y-.54+j*.27;const zz=z+.48*(1-Math.abs(yy-y)/.54);const a=project(x-.54-.5,yy,zz),c=project(x+.54-.5,yy,zz);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.strokeStyle=dark;ctx.lineWidth=.75;ctx.stroke();}}else{const ridge=z+.48;path([[x-.54,y-.54,z],[x,y-.54,z+.48],[x,y+.54,z+.48],[x-.54,y+.54,z]],lit);path([[x,y-.54,z+.48],[x+.54,y-.54,z],[x+.54,y+.54,z],[x,y+.54,z+.48]],roof);for(let j=1;j<5;j++){const xx=x-.54+j*.27;const a=project(xx-.5,y-.54,z+.48*(1-Math.abs(xx-x)/.54)),c=project(xx-.5,y+.54,z+.48*(1-Math.abs(xx-x)/.54));ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.strokeStyle=dark;ctx.lineWidth=.75;ctx.stroke();}}
}
function drawBuilding(b,alpha=1){ctx.save();ctx.globalAlpha=alpha;const x=b.x,y=b.y,h=Math.max(1,Math.min(6,b.levels||1)),c=COLORS[b.color]||COLORS[0],z0=0,z1=h*.82;
 const p=screen(x,y,-.25);ctx.fillStyle="rgba(6,45,54,.24)";ctx.beginPath();ctx.ellipse(p[0],p[1]+unit()*.18,unit()*.78,unit()*.32,0,0,Math.PI*2);ctx.fill();
 worldRect(x-.49,y-.49,x+.49,y+.49,-.22,"#706b60");
 path([[x-.49,y+.49,-.22],[x+.49,y+.49,-.22],[x+.49,y+.49,0],[x-.49,y+.49,0]],"#88816e");
 path([[x+.49,y-.49,-.22],[x+.49,y+.49,-.22],[x+.49,y+.49,0],[x+.49,y-.49,0]],"#68675f");
 worldRect(x-.47,y-.47,x+.47,y+.47,0,"#b1a68a","rgba(255,244,204,.55)",.8);
 path([[x-.46,y+.46,z0],[x+.46,y+.46,z0],[x+.46,y+.46,z1],[x-.46,y+.46,z1]],shade(c,.83));
 path([[x+.46,y-.46,z0],[x+.46,y+.46,z0],[x+.46,y+.46,z1],[x+.46,y-.46,z1]],shade(c,.66));
 // brick courses on the two sunlit walls
 for(let l=0;l<h;l++){const za=l*.82+.27,zb=l*.82+.58;path([[x-.46,y+.466,za],[x+.46,y+.466,za],[x+.46,y+.466,za+.018],[x-.46,y+.466,za+.018]],"rgba(255,226,174,.24)",null);path([[x+.466,y-.46,za],[x+.466,y+.46,za],[x+.466,y+.46,za+.018],[x+.466,y-.46,za+.018]],"rgba(255,226,174,.18)",null);
   if(l===0){windowAt([[x-.24,y+.478,za],[x-.08,y+.478,za],[x-.08,y+.478,zb],[x-.24,y+.478,zb]]);windowAt([[x+.16,y+.478,za],[x+.32,y+.478,za],[x+.32,y+.478,zb],[x+.16,y+.478,zb]]);windowAt([[x+.478,y-.3,za],[x+.478,y-.14,za],[x+.478,y-.14,zb],[x+.478,y-.3,zb]]);}
   else{windowAt([[x-.18,y+.478,za],[x+.02,y+.478,za],[x+.02,y+.478,zb],[x-.18,y+.478,zb]]);windowAt([[x+.478,y-.2,za],[x+.478,y,za],[x+.478,y,zb],[x+.478,y-.2,zb]]);}
 }
 // a small dark entry on the front wall
 path([[x+.05,y+.48,.02],[x+.25,y+.48,.02],[x+.25,y+.48,.69],[x+.05,y+.48,.69]],"#714d43","#463a36",.8);
 drawRoof(b,z1,c);
 ctx.restore();}
function drawCity(){const list=S.buildings.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y));list.forEach(b=>drawBuilding(b));}
function draw(t){ctx.setTransform(dpr,0,0,dpr,0,0);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#388f91");bg.addColorStop(.48,"#2c8083");bg.addColorStop(1,"#206c76");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // soft light in the water and slow ripple rings around the town
 const u=unit(),o=origin(),xs=S.buildings.map(b=>b.x),ys=S.buildings.map(b=>b.y),cx=xs.length?(Math.min(...xs)+Math.max(...xs))/2:.5,cy=ys.length?(Math.min(...ys)+Math.max(...ys))/2:0,cp=screen(cx,cy,-.28);
 const glow=ctx.createRadialGradient(cp[0],cp[1]+u*.4,2,cp[0],cp[1]+u*.6,u*8);glow.addColorStop(0,"rgba(196,244,226,.19)");glow.addColorStop(1,"rgba(196,244,226,0)");ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="rgba(197,250,233,.18)";ctx.lineWidth=1.5;for(let r=0;r<4;r++){const k=1+.04*Math.sin(t/1300+r);ctx.beginPath();ctx.ellipse(cp[0],cp[1]+u*.35,u*(3.1+r*.35)*k,u*(1.02+r*.15)*k,0,0,Math.PI*2);ctx.stroke();}
 ctx.setTransform(dpr*u,0,0,dpr*u,dpr*o[0],dpr*o[1]);
 // blurred reflection under the waterline
 ctx.save();ctx.globalAlpha=.13;ctx.translate(0,0);ctx.scale(1,-.33);ctx.filter="blur(2px)";drawCity();ctx.restore();ctx.filter="none";
 drawCity();
 // water glints
 for(let i=0;i<28;i++){const q=Math.sin(i*91.7)*43758.5,rx=q-Math.floor(q),qy=Math.sin(i*13.1+2)*2167.4,ry=qy-Math.floor(qy);ctx.fillStyle="rgba(219,250,233,"+(.06+.08*(.5+.5*Math.sin(t/900+i))).toFixed(2)+")";ctx.beginPath();ctx.ellipse((rx-.5)*W/u,(ry-.5)*H/u,1.5,0.7,0,0,Math.PI*2);ctx.fill();}
 if(hover){const i=find(hover.x,hover.y);if(i<0)drawBuilding({x:hover.x,y:hover.y,color:selected,levels:1,rot:rotation},.48);const q=screen(hover.x,hover.y,0);ctx.beginPath();ctx.ellipse(q[0],q[1],u*.62,u*.33,0,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,.14)";ctx.fill();}
 requestAnimationFrame(draw);}
function coords(mx,my){const u=unit(),o=origin(),a=(mx-o[0])/u,b=(my-o[1])/(u*.52);return {x:Math.round((a+b)/2+.5),y:Math.round((b-a)/2)};}
function find(x,y){return S.buildings.findIndex(b=>b.x===x&&b.y===y);}
function act(mx,my,button,shift=false){const q=coords(mx,my),i=find(q.x,q.y);if(button===2){if(i>=0){S.buildings.splice(i,1);persist();note("Gebäude gelöscht.");}return;}if(i>=0){if(shift){S.buildings[i].levels=Math.min(6,(S.buildings[i].levels||1)+1);note("Stockwerk ergänzt.");}else{S.buildings[i].rot=((S.buildings[i].rot||0)+1)%4;note("Gebäude gedreht.");}}else{S.buildings.push({x:q.x,y:q.y,color:selected,levels:1,rot:rotation});note("Haus platziert.");}persist();}
canvas.addEventListener("contextmenu",e=>e.preventDefault());
canvas.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,button:e.pointerType==="touch"?0:e.button,shift:e.shiftKey};dragging=false;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointermove",e=>{hover=coords(e.clientX,e.clientY);if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(down.button===2&&(dragging||Math.hypot(dx,dy)>5)){dragging=true;cam.x=down.cx+dx;cam.y=down.cy+dy;}});
canvas.addEventListener("pointerup",e=>{if(down&&!dragging)act(e.clientX,e.clientY,down.button,down.shift);down=null;if(e.pointerType==="touch")hover=null;});
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.2,zoom*(e.deltaY<0?1.1:.9)));},{passive:false});
window.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="r"){rotation=(rotation+1)%4;note("Vorschau gedreht · "+(rotation*90)+"°");}if(e.key==="Escape")$("menu").hidden=true;});
window.addEventListener("resize",resize);
resize();persist();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
