<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kleine Desktop-Stadt</title>
<style>
:root{--panel:#173d42d9;--text:#f5ffff;--accent:#fff;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#176d78;font-family:system-ui,"Segoe UI",sans-serif;color:var(--text);user-select:none}
#c{position:fixed;inset:0;touch-action:none;cursor:grab}
#ui{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;right:16px;top:12px;display:flex;gap:12px;padding:7px 13px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid #d9ffff55;border-radius:999px;font-weight:600;font-size:13px;pointer-events:auto;box-shadow:0 4px 18px #063c4833}
#bottom{position:absolute;left:8px;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px;display:flex;align-items:flex-start;pointer-events:none}
#bar{display:flex;flex-direction:column;gap:7px;pointer-events:auto}
button,.btn{box-sizing:border-box;width:30px;height:30px;padding:0;border:2px solid #303a38;border-radius:8px;background:#f27b68;color:#173437;cursor:pointer;box-shadow:0 2px 3px #062d3566;display:grid;place-items:center;font:inherit;font-size:0;transition:transform .12s,border-color .12s,filter .12s}
button:hover,.btn:hover{transform:translateX(3px);filter:brightness(1.08)}
button.on{border-color:#fff;box-shadow:0 0 0 2px #152c2f,0 0 0 4px #fff}
button:disabled{opacity:.55;filter:saturate(.55);cursor:not-allowed}
#bar button[data-k="haus"]{background:#f47d68} #bar button[data-k="baum"]{background:#f5aa62}
#bar button[data-k="park"]{background:#f4d060} #bar button[data-k="laden"]{background:#f1e783}
#bar button[data-k="fabrik"]{background:#b8d183} #bar button[data-k="schule"]{background:#80d16e}
#bar button[data-k="abriss"]{background:#4dc78a} #bar button[data-k="expand"]{background:#43c9b4}
#bar button[data-action="save"]{background:#45b8d2} #bar label{background:#54a6d8}
#bar button[data-action="reset"]{background:#8385d6}
#bar button[data-k="expand"],#bar button[data-action="save"]{margin-top:8px}
#msg{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;background:#173d42b8;padding:5px 12px;border-radius:99px;min-height:1em;pointer-events:none;text-align:center;color:#e9ffff;opacity:.72}
@media(max-width:600px){#top{right:8px;top:8px;gap:7px;padding:6px 9px;font-size:11px}button,.btn{width:27px;height:27px}#msg{max-width:calc(100vw - 70px);font-size:10px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top"><span id="coins">🪙 0</span><span id="inc">+0/s</span><span id="pop">👥 0</span><span id="hap">😊 0%</span></div>
  <div id="bottom">
    <div id="bar"></div>
    <div id="msg">Linksklick: bauen/drehen · Rechtsklick: löschen · Rechtsziehen: bewegen · Mausrad: zoomen</div>
  </div>
</div>
<script>
(() => {
let N = 6;
const TW = 72, TH = 36, KEY = "desktop-stadt-v2";
const B = {
  haus:   { e: "🏠", n: "Haus",   cost: 10,  inc: 1,  pop: 4 },
  baum:   { e: "🌳", n: "Baum",   cost: 5,   inc: 0,  pop: 0, joy: 1 },
  park:   { e: "⛲", n: "Park",   cost: 30,  inc: 1,  pop: 0, joy: 3 },
  laden:  { e: "🏪", n: "Laden",  cost: 60,  inc: 5,  pop: 0 },
  fabrik: { e: "🏭", n: "Fabrik", cost: 150, inc: 14, pop: 0, joy: -3 },
  schule: { e: "🏫", n: "Schule", cost: 250, inc: 8,  pop: 0, joy: 2 }
};
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
let S = load(), tool = "haus", rotation = 0, hover = null, W = 0, H = 0, dpr = 1, night = 0;
let cam = { x: 0, y: 0, z: 1 }, gifts = [], floats = [], folks = [];

/* ---------- Speichern ---------- */
function fresh() {
  N = 6; const map = Array(N * N).fill(null);
  map[2 * N + 2] = "haus"; map[2 * N + 3] = "haus";
  map[3 * N + 2] = "baum"; map[3 * N + 4] = "baum"; map[1 * N + 3] = "baum";
  return { coins: 40, size: N, map, t: Date.now(), rot: {} };
}
function valid(r) { const n = (r && r.size) || 6; return !!(r && r.map && n >= 6 && n <= 24 && r.map.length === n * n); }
function adopt(r) { N = r.size || 6; r.size = N; r.rot = r.rot || {}; return r; }
function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (valid(r)) { adopt(r); if (N === 12 && r.map.every(k => !k)) return fresh(); return r; } } catch (e) {}
  return fresh();
}
function save() { S.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Spiellogik ---------- */
function stats() {
  let inc = 0, pop = 0, joy = 0;
  S.map.forEach(k => { if (!k) return; const b = B[k]; inc += b.inc; pop += b.pop; joy += b.joy || 0; });
  const hap = Math.max(0, Math.min(100, 50 + joy * 4));
  return { inc: inc * (0.5 + hap / 100), pop, hap };
}
function msg(t) { $("msg").textContent = t; }
function expandCost() { return N >= 24 ? 0 : 100 * Math.pow((N - 6) / 2 + 1, 2); }
function expand() {
  const c = expandCost(); if (!c) return;
  if (S.coins < c) return msg("Zu wenig Münzen. Noch " + Math.ceil(c - S.coins) + " 🪙 nötig.");
  const n = N + 2, m = Array(n * n).fill(null);
  const rot = {};
  S.map.forEach((k, i) => { if (k) { const j = ((i / N | 0) + 1) * n + (i % N) + 1; m[j] = k; if (S.rot && S.rot[i]) rot[j] = S.rot[i]; } });
  S.coins -= c; S.map = m; S.built = {}; S.rot = rot; S.size = N = n;
  folks.forEach(f => { f.x++; f.y++; f.tx++; f.ty++; });
  gifts.forEach(g => { g.x++; g.y++; });
  floats = []; hover = null; fit();
  msg("Die Insel ist jetzt " + n + "×" + n + " Felder groß!");
  ui(); save();
}
function ui() {
  const s = stats();
  $("coins").textContent = "🪙 " + Math.floor(S.coins);
  $("inc").textContent = "+" + s.inc.toFixed(1) + "/s";
  $("pop").textContent = "👥 " + s.pop;
  $("hap").textContent = "😊 " + s.hap + "%";
  const ex = $("ex");
  if (ex) { const c = expandCost(); ex.textContent = c ? "🏝️ Erweitern · " + c : "🏝️ Maximalgröße"; ex.disabled = !c || S.coins < c; }
  document.querySelectorAll("#bar button[data-k]").forEach(b => {
    const k = b.dataset.k; b.classList.toggle("on", k === tool);
    if (B[k]) b.disabled = S.coins < B[k].cost;
  });
}
function buildBar() {
  const el = $("bar");
  Object.keys(B).forEach(k => {
    const b = document.createElement("button"); b.dataset.k = k;
    b.textContent = B[k].e + " " + B[k].n + " · " + B[k].cost;
    b.title = B[k].n + " · " + B[k].cost + " Münzen";
    b.onclick = () => {
      tool = k; const x = B[k];
      msg(x.n + ": +" + x.inc + "/s" + (x.pop ? ", " + x.pop + " Bewohner" : "") + (x.joy ? ", Zufriedenheit " + (x.joy > 0 ? "+" : "") + x.joy : ""));
      ui();
    };
    el.appendChild(b);
  });
  const mk = (txt, fn, k) => { const b = document.createElement("button"); if (k) b.dataset.k = k; b.textContent = txt; b.onclick = fn; el.appendChild(b); return b; };
  const demolish = mk("🧹 Abriss", () => { tool = "abriss"; msg("Linksklick löscht ein Gebäude (halber Preis zurück)."); ui(); }, "abriss"); demolish.title = "Abriss · halber Preis zurück";
  const expandButton = mk("", expand, "expand"); expandButton.id = "ex"; expandButton.title = "Insel erweitern";
  const saveButton = mk("⬇ Speichern", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: "application/json" }));
    a.download = "stadt-speicherstand.json"; a.click();
  });
  saveButton.dataset.action = "save"; saveButton.title = "Speicherstand herunterladen";
  const lab = document.createElement("label"); lab.className = "btn"; lab.textContent = "⬆ Laden"; lab.title = "Speicherstand laden";
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json"; inp.hidden = true;
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => {
      const r = JSON.parse(t);
      if (valid(r)) { S = adopt(r); gifts = []; save(); syncFolks(); ui(); msg("Speicherstand geladen."); } else msg("Ungültige Datei.");
    }).catch(() => msg("Ungültige Datei."));
  };
  lab.appendChild(inp); el.appendChild(lab);
  const resetButton = mk("↺ Neu", () => { if (confirm("Stadt wirklich zurücksetzen?")) { S = fresh(); gifts = []; fit(); save(); syncFolks(); ui(); } });
  resetButton.dataset.action = "reset"; resetButton.title = "Neue Stadt";
}
function place(i) {
  if (i === null) return;
  if (tool === "abriss") {
    const k = S.map[i]; if (!k) return;
    const back = Math.floor(B[k].cost / 2);
    S.coins += back; S.map[i] = null; delete S.rot[i]; msg("Abgerissen, " + back + " 🪙 zurück");
    syncFolks(); ui(); save(); return;
  }
  if (S.map[i]) { S.rot = S.rot || {}; S.rot[i] = ((S.rot[i] || 0) + 1) % 4; msg("Gebäude gedreht · " + (S.rot[i] * 90) + "°"); save(); return; }
  const b = B[tool];
  if (S.coins < b.cost) return msg("Zu wenig Münzen. Noch " + Math.ceil(b.cost - S.coins) + " 🪙 nötig.");
  S.coins -= b.cost; S.map[i] = tool;
  S.rot = S.rot || {}; S.rot[i] = rotation;
  S.built = S.built || {}; S.built[i] = performance.now();
  syncFolks(); ui(); save();
}

/* ---------- Bewohner & Geschenke ---------- */
const SKIN = ["#f2c9a0", "#d9a36f", "#8d5a3b"], CLOTH = ["#d9443a", "#3a7bd9", "#e0a82e", "#5aa86a", "#8a5ad9"];
function syncFolks() {
  const n = Math.min(16, Math.floor(stats().pop / 2));
  while (folks.length < n) {
    const x = Math.random() * N, y = Math.random() * N;
    folks.push({ x, y, tx: x, ty: y, c: CLOTH[folks.length % 5], k: SKIN[folks.length % 3], ph: Math.random() * 9 });
  }
  folks.length = n;
}
function spawnGift() {
  gifts = gifts.filter(g => Date.now() - g.t0 < 25000);
  if (gifts.length) return;
  gifts.push({ x: (Math.random() * (N - 1)) | 0, y: (Math.random() * (N - 1)) | 0, t0: Date.now() });
}

/* ---------- Iso-Zeichnen ---------- */
const hs = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const P = (x, y, z = 0) => [(x - y) * TW / 2, (x + y) * TH / 2 - z];
const rgb = (c, f) => "rgb(" + [0, 1, 2].map(i => Math.min(255, c[i] * f | 0)) + ")";
function poly(pts, fill) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function el(p, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(p[0], p[1], rx, ry, 0, 0, 7); ctx.fillStyle = fill; ctx.fill(); }
function circ(p, r, fill) { ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.fillStyle = fill; ctx.fill(); }
function shadow(x, y, rx, ry) { el(P(x, y, 0), rx, ry, "rgba(0,0,0,.2)"); }
function box(x, y, w, d, h, z0, c) {
  poly([P(x, y + d, z0), P(x + w, y + d, z0), P(x + w, y + d, z0 + h), P(x, y + d, z0 + h)], rgb(c, .8));
  poly([P(x + w, y, z0), P(x + w, y + d, z0), P(x + w, y + d, z0 + h), P(x + w, y, z0 + h)], rgb(c, .6));
  poly([P(x, y, z0 + h), P(x + w, y, z0 + h), P(x + w, y + d, z0 + h), P(x, y + d, z0 + h)], rgb(c, 1.05));
}
function roof(x, y, w, d, z0, rh, c) {
  const a = P(x + w / 2, y + d / 2, z0 + rh);
  poly([P(x, y + d, z0), P(x + w, y + d, z0), a], rgb(c, .88));
  poly([P(x + w, y + d, z0), P(x + w, y, z0), a], rgb(c, .66));
}
function win(x, y, w, d, u0, u1, v0, v1, fill, side) {
  const f = side === "R" ? u => [x + w, y + u * d] : u => [x + u * w, y + d];
  const [ax, ay] = f(u0), [bx, by] = f(u1);
  poly([P(ax, ay, v0), P(bx, by, v0), P(bx, by, v1), P(ax, ay, v1)], fill);
}
const WALL = [[232, 82, 82], [249, 211, 120], [239, 113, 91], [246, 218, 150]];
const ROOF = [[223, 91, 69], [226, 111, 72], [235, 133, 78], [198, 79, 67]];

function drawB(k, tx, ty, i, t) {
  i = ty * 24 + tx;
  const lit = night > .2, wc = lit ? "#ffe18a" : "#8fb9d9";
  if (k === "haus") {
    const v = ((tx + ty * 6) % 4), x = tx + .16, y = ty + .16;
    shadow(tx + .5, ty + .5, 32, 14);
    box(x, y, .68, .68, 68, 0, WALL[v]); roof(tx + .1, ty + .1, .8, .8, 68, 36, ROOF[v]);
    win(x, y, .68, .68, .15, .38, 24, 43, wc); win(x, y, .68, .68, .58, .82, 24, 43, wc);
    win(x, y, .68, .68, .2, .5, 24, 43, wc, "R");
    const door = P(x + .5, y + .68, 0); ctx.fillStyle = "#7f4c3d"; ctx.fillRect(door[0] - 3, door[1] - 20, 6, 20);
    ctx.strokeStyle = "rgba(255,242,204,.42)"; ctx.lineWidth = 1;
    for (let s = 1; s <= 4; s++) { const q = P(tx + .1 + s * .13, ty + .1, 68 + 36 * (1 - s / 5)); const apex = P(tx + .5, ty + .5, 104); ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(apex[0], apex[1]); ctx.stroke(); }
  } else if (k === "baum") {
    const s = .85 + .3 * hs(i), sw = Math.sin(t / 900 + i) * 1.5;
    shadow(tx + .5, ty + .5, 24 * s, 10 * s);
    box(tx + .43, ty + .43, .14, .14, 14 * s, 0, [110, 76, 48]);
    [[18, 17, .85], [29, 14, 1], [38, 9, 1.15]].forEach(([z, r, f]) => {
      const p = P(tx + .5, ty + .5, z * s); p[0] += sw * (z / 30);
      circ(p, r * s, rgb([56, 150, 78], f)); circ([p[0] - 4 * s, p[1] - 4 * s], r * s * .5, rgb([90, 185, 100], f));
    });
  } else if (k === "park") {
    box(tx + .06, ty + .06, .88, .88, 3, 0, [205, 208, 200]);
    const c = P(tx + .5, ty + .5, 3);
    el(c, 27, 13.5, "#9aa7b0"); el([c[0], c[1] + 2], 22, 10.5, "#52b6e8");
    el([c[0], c[1] + 2], 14 + Math.sin(t / 400) * 2, 6, "#8fd6f5");
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.lineTo(c[0], c[1] - 18); ctx.stroke();
    for (let j = 0; j < 3; j++) { const ph = ((t / 30 + j * 14) % 40) / 40; circ([c[0] + (j - 1) * ph * 12, c[1] - 18 + ph * 20], 2.2, "rgba(255,255,255,.85)"); }
    circ(P(tx + .15, ty + .8, 8), 7, "#4f9d62"); circ(P(tx + .85, ty + .2, 8), 7, "#4f9d62");
  } else if (k === "laden") {
    const x = tx + .1, y = ty + .14, w = .8, d = .72;
    shadow(tx + .5, ty + .5, 34, 15);
    box(x, y, w, d, 24, 0, [243, 226, 184]); box(tx + .3, ty + .3, .4, .3, 6, 24, [220, 90, 70]);
    win(x, y, w, d, .38, .62, 0, 11, "#6b4a35");
    for (let j = 0; j < 4; j++) {
      const u0 = x + j / 4 * w, u1 = x + (j + 1) / 4 * w, fy = y + d;
      poly([P(u0, fy, 18), P(u1, fy, 18), P(u1, fy + .12, 12), P(u0, fy + .12, 12)], j % 2 ? "#fff" : "#d9443a");
    }
    win(x, y, w, d, .1, .3, 4, 12, wc, "L"); win(x, y, w, d, .7, .9, 4, 12, wc, "L");
  } else if (k === "fabrik") {
    shadow(tx + .5, ty + .5, 36, 16);
    box(tx + .06, ty + .12, .88, .76, 22, 0, [176, 180, 190]); box(tx + .1, ty + .16, .4, .68, 8, 22, [150, 154, 166]);
    win(tx + .06, ty + .12, .88, .76, .1, .9, 8, 14, lit ? "#ffd27a" : "#7f95a8");
    box(tx + .62, ty + .2, .16, .16, 48, 0, [168, 84, 70]);
    for (let j = 0; j < 3; j++) {
      const ph = ((t / 2500) + j / 3) % 1, p = P(tx + .7, ty + .28, 50 + ph * 36);
      circ([p[0] + ph * 8, p[1]], 5 + ph * 9, "rgba(235,235,240," + (.55 * (1 - ph)).toFixed(2) + ")");
    }
  } else if (k === "schule") {
    shadow(tx + .5, ty + .5, 36, 16);
    box(tx + .08, ty + .12, .84, .76, 26, 0, [242, 204, 120]);
    box(tx + .36, ty + .3, .28, .3, 16, 26, [230, 190, 110]); roof(tx + .34, ty + .28, .32, .34, 42, 14, [190, 70, 60]);
    [.12, .4, .68].forEach(u => win(tx + .08, ty + .12, .84, .76, u, u + .2, 8, 18, wc));
    const p = P(tx + .5, ty + .45, 56); ctx.strokeStyle = "#555"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[0], p[1] - 16); ctx.stroke();
    poly([[p[0], p[1] - 16], [p[0] + 13, p[1] - 13 + Math.sin(t / 200) * 2], [p[0], p[1] - 9]], "#d9443a");
  }
}

function drawBigB(k, tx, ty, i, t, r = 0) {
  const p = P(tx + .5, ty + .5); ctx.save(); ctx.translate(p[0], p[1]);
  ctx.rotate((r || 0) * Math.PI / 2); ctx.scale(2.1, 2.1); ctx.translate(-p[0], -p[1]);
  drawB(k, tx, ty, i, t); ctx.restore();
}

/* ---------- Kamera & Eingabe ---------- */
const org = () => [W / 2 + cam.x, H / 2 + cam.y - (N * TH / 2 - 10) * cam.z];
function toScreen(wx, wy) { const o = org(); return [o[0] + wx * cam.z, o[1] + wy * cam.z]; }
function pick(mx, my) {
  const o = org(), a = (mx - o[0]) / cam.z / (TW / 2), b = (my - o[1]) / cam.z / (TH / 2);
  const x = Math.floor((a + b) / 2), y = Math.floor((b - a) / 2);
  return x >= 0 && y >= 0 && x < N && y < N ? y * N + x : null;
}
function resize() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
}
function fit() {
  cam.x = W * .17; cam.y = 0;
  cam.z = Math.max(.4, Math.min(.85, Math.min(W * .31 / (N * TW), (H - 120) / (N * TH + 120))));
}
let down = null, drag = false;
cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, button: e.pointerType === "touch" ? 0 : e.button }; drag = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  hover = pick(e.clientX, e.clientY);
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (down.button === 2 && (drag || Math.hypot(dx, dy) > 5)) { drag = true; cam.x = down.cx + dx; cam.y = down.cy + dy; }
});
cv.addEventListener("pointerup", e => {
  if (down && !drag) click(e.clientX, e.clientY, down.button);
  down = null; if (e.pointerType === "touch") hover = null;
});
cv.addEventListener("wheel", e => { e.preventDefault(); cam.z = Math.max(.4, Math.min(2.4, cam.z * (e.deltaY < 0 ? 1.1 : .9))); }, { passive: false });
addEventListener("resize", resize);
addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "r" && !e.ctrlKey && !e.altKey && !e.metaKey) {
    rotation = (rotation + 1) % 4; msg("Drehung: " + (rotation * 90) + "° · Linksklick auf Gebäude dreht es weiter.");
  }
});
function click(mx, my, button = 0) {
  const i = pick(mx, my);
  if (button === 2) {
    if (i === null || !S.map[i]) return;
    const k = S.map[i], back = Math.floor(B[k].cost / 2);
    S.coins += back; S.map[i] = null; delete S.rot?.[i];
    msg("Gebäude gelöscht · +" + back + " 🪙"); syncFolks(); ui(); save(); return;
  }
  for (const g of gifts) {
    const p = P(g.x + .5, g.y + .5, 30), s = toScreen(p[0], p[1]);
    if (Math.hypot(s[0] - mx, s[1] - my) < 28 * cam.z) {
      const v = Math.max(10, Math.floor(stats().inc * 30));
      S.coins += v; floats.push({ x: p[0], y: p[1], t: Date.now(), s: "+" + v + " 🪙" });
      gifts = gifts.filter(q => q !== g); ui(); save(); return;
    }
  }
  place(i);
}

/* ---------- Render-Loop ---------- */
function nightLevel() {
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h < 5 || h >= 21) return .55;
  if (h < 7) return .55 * (7 - h) / 2;
  if (h >= 18) return .55 * (h - 18) / 3;
  return 0;
}
function diamond(a, b, z, fill) { poly([P(a, a, z), P(b, a, z), P(b, b, z), P(a, b, z)], fill); }
let last = 0;
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#187985"); g.addColorStop(.55, "#176e79"); g.addColorStop(1, "#155a68");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const o = org(); ctx.setTransform(dpr * cam.z, 0, 0, dpr * cam.z, dpr * o[0], dpr * o[1]);

  const center = P(N / 2, N / 2, -12);
  ctx.strokeStyle = "rgba(182,247,229,.15)"; ctx.lineWidth = 2 / cam.z;
  for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.ellipse(center[0], center[1] + 35, N * (33 + j * 5), N * (13 + j * 2), 0, 0, Math.PI * 2); ctx.stroke(); }
  const reflection = ctx.createRadialGradient(center[0], center[1] + 74, 2, center[0], center[1] + 74, N * 38);
  reflection.addColorStop(0, "rgba(221,249,218,.17)"); reflection.addColorStop(1, "rgba(221,249,218,0)");
  ctx.fillStyle = reflection; ctx.beginPath(); ctx.ellipse(center[0], center[1] + 78, N * 22, N * 13, 0, 0, Math.PI * 2); ctx.fill();
  const w1 = Math.sin(t / 1500) * .12;
  diamond(-1.7 + w1, N + 1.7 - w1, -28, "rgba(203,255,232,.17)");
  diamond(-.9 - w1, N + .9 + w1, -26, "#d2bb8e");
  poly([P(0, N, 0), P(N, N, 0), P(N, N, -28), P(0, N, -28)], "#786650");
  poly([P(N, 0, 0), P(N, N, 0), P(N, N, -28), P(N, 0, -28)], "#665846");
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const f = .94 + .08 * hs(y * 24 + x) + ((x + y) & 1 ? 0 : .025);
    poly([P(x, y), P(x + 1, y), P(x + 1, y + 1), P(x, y + 1)], rgb([166, 156, 132], f));
    ctx.strokeStyle = "rgba(86,77,62,.28)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(...P(x, y + 1)); ctx.lineTo(...P(x + 1, y + 1)); ctx.lineTo(...P(x + 1, y)); ctx.stroke();
  }
  if (hover !== null) {
    const x = hover % N, y = (hover / N) | 0, bad = tool === "abriss" ? !S.map[hover] : !!S.map[hover];
    poly([P(x, y), P(x + 1, y), P(x + 1, y + 1), P(x, y + 1)], bad ? "rgba(255,80,80,.4)" : "rgba(255,255,255,.4)");
  }

  const items = [];
  S.map.forEach((k, i) => { if (k) items.push({ d: (i % N) + ((i / N) | 0) + 1, f: () => {
    const tx = i % N, ty = (i / N) | 0, age = S.built && S.built[i] ? (performance.now() - S.built[i]) / 300 : 1;
    if (age < 1) { const p = P(tx + .5, ty + .5); ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(.4 + .6 * age, .4 + .6 * age); ctx.translate(-p[0], -p[1]); drawBigB(k, tx, ty, i, t, S.rot && S.rot[i]); ctx.restore(); }
    else drawBigB(k, tx, ty, i, t, S.rot && S.rot[i]);
  } }); });
  if (hover !== null && tool !== "abriss" && !S.map[hover]) {
    items.push({ d: (hover % N) + ((hover / N) | 0) + 1, f: () => { ctx.globalAlpha = .55; drawBigB(tool, hover % N, (hover / N) | 0, hover, t, rotation); ctx.globalAlpha = 1; } });
  }
  folks.forEach(f => {
    const dx = f.tx - f.x, dy = f.ty - f.y, dist = Math.hypot(dx, dy);
    if (dist < .05) { f.tx = Math.max(.2, Math.min(N - .2, f.x + (Math.random() - .5) * 4)); f.ty = Math.max(.2, Math.min(N - .2, f.y + (Math.random() - .5) * 4)); }
    else { f.x += dx / dist * .6 * dt; f.y += dy / dist * .6 * dt; }
    items.push({ d: f.x + f.y, f: () => {
      const p = P(f.x, f.y), b = Math.sin(t / 130 + f.ph);
      el([p[0], p[1]], 4, 2, "rgba(0,0,0,.25)");
      ctx.fillStyle = f.c; ctx.fillRect(p[0] - 2.5, p[1] - 8 + b * .8, 5, 7); circ([p[0], p[1] - 11 + b * .8], 2.8, f.k);
    } });
  });
  items.sort((a, b) => a.d - b.d).forEach(it => it.f());

  const now = Date.now();
  gifts = gifts.filter(q => now - q.t0 < 25000);
  gifts.forEach(q => {
    const p = P(q.x + .5, q.y + .5, 30 + Math.sin(t / 250) * 5);
    ctx.font = "28px serif"; ctx.textAlign = "center"; ctx.fillText("🎁", p[0], p[1]);
  });
  floats = floats.filter(q => now - q.t < 1200);
  floats.forEach(q => {
    const a = (now - q.t) / 1200; ctx.globalAlpha = 1 - a; ctx.font = "bold 18px system-ui"; ctx.textAlign = "center";
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#0008"; ctx.lineWidth = 3;
    ctx.strokeText(q.s, q.x, q.y - 20 - a * 40); ctx.fillText(q.s, q.x, q.y - 20 - a * 40); ctx.globalAlpha = 1;
  });

  night += (nightLevel() - night) * Math.min(1, dt);
  if (night > .01) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = "rgba(25,40,110," + night.toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = "source-over";
  }
  requestAnimationFrame(frame);
}

/* ---------- Start ---------- */
const secs = Math.min(8 * 3600, (Date.now() - (S.t || Date.now())) / 1000), gain = Math.floor(secs * stats().inc * .5);
if (gain > 0) { S.coins += gain; setTimeout(() => msg("Willkommen zurück! Deine Stadt hat in der Zeit " + gain + " 🪙 verdient."), 0); }
buildBar(); resize(); fit(); syncFolks(); ui(); night = nightLevel();
setInterval(() => { S.coins += stats().inc; ui(); }, 1000);
setInterval(() => { if (Math.random() < .45) spawnGift(); }, 20000);
setInterval(save, 10000);
addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
requestAnimationFrame(frame);
})();
</script>
</body>
